name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -v
      - run: python tools/credit_validate.py examples/.well-known/credit.json examples/company.json
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm test
      - name: ledger light (lit/dark)
        run: node cli/credit.js verify
      - name: scan site data matches ledger
        run: cmp ledger/grants.jsonl docs/grants.jsonl && cmp ledger/keys.json docs/keys.json
      - name: crawler feeds match ledger (feed.json / Atom feed.xml are deterministic)
        run: node cli/credit.js site --out /tmp/site >/dev/null && cmp /tmp/site/feed.json docs/feed.json && cmp /tmp/site/feed.xml docs/feed.xml
      - name: funding smoke (writes pointers once, never overwrites)
        run: |
          mkdir -p /tmp/fund && echo '{"name":"x"}' > /tmp/fund/package.json
          node cli/credit.js funding --dir /tmp/fund
          grep -q 'fitzyracing1.github.io/credit' /tmp/fund/.github/FUNDING.yml /tmp/fund/package.json
          node cli/credit.js funding --dir /tmp/fund | grep -q 'kept existing'
      - name: action sync smoke test (no PR)
        run: node cli/credit.js sync --repo fitzyracing1/credit --ledger ledger/grants.jsonl --out /tmp/CREDIT.json
      - name: front sticky-comment body smoke (bot-prs / every-pr modes)
        run: node cli/credit.js front --repo fitzyracing1/credit --ledger ledger/grants.jsonl --out /tmp/front.md && grep -q 'credit-front' /tmp/front.md
      - name: propose smoke (on-merge mode; unsigned, ledger untouched)
        run: |
          node cli/credit.js propose octocat --repo fitzyracing1/credit --pr 1 --title "smoke" --out /tmp/proposal --readme /tmp/README.md
          grep -q 'CREDIT-1/proposal' /tmp/proposal/proposal.json
          grep -q 'credit-contributors' /tmp/README.md
          git diff --exit-code -- ledger/
