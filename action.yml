name: credit repo wallet
description: Fetch the public credit ledger, verify it (lit/dark), and keep this repo's CREDIT.json in sync via a PR in this repo.
branding: { icon: award, color: yellow }
inputs:
  ledger-url:
    description: Raw URL of grants.jsonl
    default: https://raw.githubusercontent.com/fitzyracing1/credit/main/ledger/grants.jsonl
  repo:
    description: Recipient id (owner/repo). Defaults to this repository.
    default: ${{ github.repository }}
  token:
    description: Token able to push a branch and open a PR in THIS repo (needs contents+pull-requests write)
    default: ${{ github.token }}
  open-pr:
    description: "Set to 'false' to only verify and write CREDIT.json without opening a PR"
    default: "true"
  funding:
    description: "Set to 'false' to skip writing .github/FUNDING.yml + package.json funding pointers at the scan page (existing values are never overwritten)"
    default: "true"
  scan-url:
    description: Scan page URL the funding pointers reference
    default: https://fitzyracing1.github.io/credit/
outputs:
  status: { description: "lit or dark", value: "${{ steps.sync.outputs.status }}" }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: "20" }
    - id: sync
      shell: bash
      env: { LEDGER: "${{ inputs.ledger-url }}", REPO: "${{ inputs.repo }}" }
      run: |
        if node "$GITHUB_ACTION_PATH/cli/credit.js" sync --repo "$REPO" --ledger "$LEDGER" --out CREDIT.json; then
          echo "status=lit" >> "$GITHUB_OUTPUT"
        else
          echo "status=dark" >> "$GITHUB_OUTPUT"; exit 1
        fi
    - if: inputs.funding == 'true'
      shell: bash
      env: { SCAN: "${{ inputs.scan-url }}" }
      run: node "$GITHUB_ACTION_PATH/cli/credit.js" funding --dir . --scan "$SCAN"
    - if: inputs.open-pr == 'true'
      shell: bash
      env: { GH_TOKEN: "${{ inputs.token }}" }
      run: |
        FILES="CREDIT.json .github/FUNDING.yml package.json"
        git status --porcelain -- $FILES | grep -q . || { echo "nothing to sync"; exit 0; }
        BR=credit/sync-balance
        git config user.name "credit-wallet[bot]"; git config user.email "credit-wallet@users.noreply.github.com"
        git checkout -B "$BR"
        for f in $FILES; do [ -e "$f" ] && git add "$f"; done
        git commit -m "credit: sync CREDIT.json from public ledger"
        git push -f origin "$BR"
        gh pr view "$BR" >/dev/null 2>&1 || gh pr create --head "$BR" --title "credit: sync CREDIT.json" --body "Automated by the credit repo-wallet Action. Ledger verified: lit. May also add scan-page funding pointers (.github/FUNDING.yml, package.json#funding) — existing values are never overwritten."
